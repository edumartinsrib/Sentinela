[project]
name = "sentinela-core"
version = "0.1.0"
description = "Contratos compartilhados do Sentinela: enums, diff, regras, achados, prompt e lógica do gate"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "regex>=2024.11.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinela_core"]
